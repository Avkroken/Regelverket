rulesets:
  - id: ruleset.main
    github_id: 21637289
    name: Protect main
    target: branch
    enforcement: active
    conditions:
      include: ["~DEFAULT_BRANCH"]
      exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
      - type: required_linear_history
      - type: required_status_checks
        parameters:
          strict: false
          do_not_enforce_on_create: true
          checks:
            - {context: test, integration_id: 15368}
            - {context: osv, integration_id: 15368}
            - {context: scope-policy, integration_id: 15368}
      - type: pull_request
        parameters:
          required_approving_review_count: 0
          dismiss_stale_reviews_on_push: true
          required_review_thread_resolution: true
          require_extra_approval_for_unattributed_changes: true
          allowed_merge_methods: [squash]
      - type: merge_queue
        parameters:
          merge_method: SQUASH
          max_entries_to_build: 1
          min_entries_to_merge: 1
          max_entries_to_merge: 1
          min_entries_to_merge_wait_minutes: 0
          grouping_strategy: ALLGREEN
          check_response_timeout_minutes: 60
      - type: code_scanning
        parameters:
          tools:
            - tool: CodeQL
              security_alerts_threshold: all
              alerts_threshold: all
    bypass_actors: []
    current_user_can_bypass: never
    evidence: [ev.ruleset.main]

  - id: ruleset.lock
    github_id: 21637293
    name: Lock branches
    target: branch
    enforcement: active
    evidence: [ev.rulesets.list]
  - id: ruleset.docs
    github_id: 21637287
    name: Protect docs content
    target: branch
    enforcement: active
    evidence: [ev.rulesets.list]
  - id: ruleset.security_reports
    github_id: 21637286
    name: Protect security reports
    target: branch
    enforcement: active
    evidence: [ev.rulesets.list]
  - id: ruleset.work
    github_id: 21637292
    name: Protect work branches
    target: branch
    enforcement: active
    evidence: [ev.rulesets.list]

