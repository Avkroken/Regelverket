name: GitHub Adapter Spike

on:
  pull_request:
    paths:
      - 'spikes/github-adapter/**'
      - 'scripts/verify-github-adapter-spike.sh'
      - '.github/workflows/github-adapter-spike.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify GitHub adapters
        shell: bash
        run: bash scripts/verify-github-adapter-spike.sh

      - name: Persist generated Rust lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          lock='spikes/github-adapter/rust/Cargo.lock'
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${lock}?ref=${HEAD_REF}" >/dev/null 2>&1; then
            exit 0
          fi
          content="$(base64 -w0 "$lock")"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${lock}" \
            -f message='fix: lock Rust adapter dependencies' \
            -f content="$content" \
            -f branch="$HEAD_REF" >/dev/null
