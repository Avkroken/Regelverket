name: Packaging Spike

on:
  pull_request:
    paths:
      - 'spikes/go/**'
      - 'spikes/rust/**'
      - 'scripts/verify-packaging-spike.sh'
      - '.github/workflows/packaging-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: spikes/go/go.mod
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify host-native packaging
        shell: bash
        run: bash scripts/verify-packaging-spike.sh
