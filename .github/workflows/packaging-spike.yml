name: Packaging Spike

on:
  pull_request:
    paths:
      - 'spikes/go/**'
      - 'spikes/rust/**'
      - 'scripts/verify-packaging-spike.sh'
      - '.github/workflows/packaging-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify host-native packaging
        shell: bash
        run: bash scripts/verify-packaging-spike.sh
