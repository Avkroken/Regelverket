name: Technology Spikes

on:
  pull_request:
    paths:
      - 'spikes/**'
      - 'fixtures/config/**'
      - 'fixtures/observed-state/**'
      - 'scripts/verify-technology-spikes.sh'
      - '.github/workflows/technology-spikes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify technology spikes
        shell: bash
        run: bash scripts/verify-technology-spikes.sh
