name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: dependabot-automerge-${{ github.repository }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reconcile Dependabot pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u -o pipefail

          mapfile -t prs < <(
            gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" \
              --jq '.[] | select(.user.login == "dependabot[bot]" and .draft == false) | .number'
          )

          for pr in "${prs[@]}"; do
            if [[ "$(gh pr view "$pr" --repo "$GH_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" != "true" ]]; then
              if ! gh pr merge "$pr" --repo "$GH_REPO" --auto --squash; then
                echo "::warning title=Dependabot auto-merge::Could not arm auto-merge for PR #${pr}; a later reconciliation will retry."
              fi
            fi

            merge_state="$(gh pr view "$pr" --repo "$GH_REPO" --json mergeStateStatus --jq '.mergeStateStatus')"
            if [[ "$merge_state" != "BEHIND" ]]; then
              continue
            fi

            base_sha="$(gh pr view "$pr" --repo "$GH_REPO" --json baseRefOid --jq '.baseRefOid')"
            marker="dependabot-automerge-rebase:${base_sha}"
            latest_request="$(
              gh api --paginate "repos/${GH_REPO}/issues/${pr}/comments?per_page=100" \
                --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${marker}\")) | .created_at" \
                | tail -n 1
            )"

            request_rebase=true
            if [[ -n "$latest_request" ]]; then
              if last_epoch="$(date -d "$latest_request" +%s 2>/dev/null)"; then
                now_epoch="$(date -u +%s)"
                if (( now_epoch - last_epoch < 3600 )); then
                  request_rebase=false
                fi
              fi
            fi

            if [[ "$request_rebase" == "true" ]]; then
              body="$(printf '@dependabot rebase\n\n<!-- %s -->' "$marker")"
              if ! gh pr comment "$pr" --repo "$GH_REPO" --body "$body"; then
                echo "::warning title=Dependabot rebase::Could not request a Dependabot rebase for PR #${pr}; a later reconciliation will retry."
              fi
            fi
          done
