name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  required:
    name: CI / required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify retired repository stays minimal
        shell: bash
        run: |
          set -euo pipefail

          forbidden=(
            Cargo.toml
            Cargo.lock
            src
            docs
            fixtures
            scripts
            spikes
            codeql.yml
          )

          for path in "${forbidden[@]}"; do
            if [[ -e "$path" ]]; then
              echo "::error::Retired Regelverket product content was reintroduced: $path"
              exit 1
            fi
          done

          test -f README.md
          test -f AGENTS.md
          test -f .github/workflows/required-ci.yml
          test -f .github/workflows/scope-policy.yml
