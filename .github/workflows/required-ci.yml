name: Required CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.impact.outputs.core }}
      adapter: ${{ steps.impact.outputs.adapter }}
      technology: ${{ steps.impact.outputs.technology }}
      packaging: ${{ steps.impact.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bestäm verifieringspåverkan
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          core=false
          adapter=false
          technology=false
          packaging=false
          all=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            all=true
          else
            changed="$(git diff --name-only --diff-filter=ACMRDTUXB "$BASE_SHA" "$HEAD_SHA")"
            [[ -n "$changed" ]] || all=true
            while IFS= read -r file; do
              [[ -n "$file" ]] || continue

              case "$file" in
                Cargo.toml|Cargo.lock|src/*|.github/workflows/compiler-core.yml)
                  core=true ;;
              esac

              case "$file" in
                spikes/github-adapter/*|scripts/verify-github-adapter-spike.sh|.github/workflows/github-adapter-spike.yml)
                  adapter=true ;;
              esac

              case "$file" in
                spikes/go/*|spikes/rust/*|scripts/verify-packaging-spike.sh|.github/workflows/packaging-spike.yml)
                  packaging=true ;;
              esac

              case "$file" in
                spikes/*|fixtures/config/*|fixtures/observed-state/*|fixtures/workflows/*|scripts/verify-technology-spikes.sh|.github/workflows/technology-spikes.yml)
                  technology=true ;;
              esac

              case "$file" in
                .github/workflows/required-ci.yml)
                  all=true ;;
                *.md|docs/*|README*|LICENSE*|AGENTS.md|CLAUDE.md|SKILLS.md)
                  ;;
                Cargo.toml|Cargo.lock|src/*|spikes/*|fixtures/config/*|fixtures/observed-state/*|fixtures/workflows/*|scripts/verify-github-adapter-spike.sh|scripts/verify-packaging-spike.sh|scripts/verify-technology-spikes.sh|.github/workflows/compiler-core.yml|.github/workflows/github-adapter-spike.yml|.github/workflows/packaging-spike.yml|.github/workflows/technology-spikes.yml)
                  ;;
                *)
                  all=true ;;
              esac
            done <<< "${changed:-}"
          fi

          if [[ "$all" == true ]]; then
            core=true
            adapter=true
            technology=true
            packaging=true
          fi

          {
            echo "core=$core"
            echo "adapter=$adapter"
            echo "technology=$technology"
            echo "packaging=$packaging"
          } >> "$GITHUB_OUTPUT"

  core:
    needs: impact
    if: ${{ needs.impact.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  github-adapter:
    needs: impact
    if: ${{ needs.impact.outputs.adapter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/verify-github-adapter-spike.sh

  technology:
    needs: impact
    if: ${{ needs.impact.outputs.technology == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/verify-technology-spikes.sh

  packaging:
    needs: impact
    if: ${{ needs.impact.outputs.packaging == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: spikes/go/go.mod
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - shell: bash
        run: bash scripts/verify-packaging-spike.sh

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [impact, core, github-adapter, technology, packaging]
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera all relevant verifiering
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          CORE_IMPACT: ${{ needs.impact.outputs.core }}
          CORE_RESULT: ${{ needs.core.result }}
          ADAPTER_IMPACT: ${{ needs.impact.outputs.adapter }}
          ADAPTER_RESULT: ${{ needs.github-adapter.result }}
          TECHNOLOGY_IMPACT: ${{ needs.impact.outputs.technology }}
          TECHNOLOGY_RESULT: ${{ needs.technology.result }}
          PACKAGING_IMPACT: ${{ needs.impact.outputs.packaging }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
        run: |
          set -euo pipefail
          test "$IMPACT_RESULT" = "success"
          check() {
            local impact="$1" result="$2" name="$3"
            if [[ "$impact" == "true" ]]; then
              [[ "$result" == "success" ]] || { echo "::error::$name: $result"; exit 1; }
            else
              [[ "$result" == "skipped" || "$result" == "success" ]] || { echo "::error::$name oväntat resultat: $result"; exit 1; }
            fi
          }
          check "$CORE_IMPACT" "$CORE_RESULT" core
          check "$ADAPTER_IMPACT" "$ADAPTER_RESULT" github-adapter
          check "$TECHNOLOGY_IMPACT" "$TECHNOLOGY_RESULT" technology
          check "$PACKAGING_IMPACT" "$PACKAGING_RESULT" packaging
