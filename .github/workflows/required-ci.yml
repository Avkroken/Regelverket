name: Required CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  impact:
    name: Determine CI impact
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      core: ${{ steps.classify.outputs.core }}
      adapter: ${{ steps.classify.outputs.adapter }}
      technology: ${{ steps.classify.outputs.technology }}
      packaging: ${{ steps.classify.outputs.packaging }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          core=false
          adapter=false
          technology=false
          packaging=false
          run_all=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            run_all=true
          else
            changed="$(git diff --no-renames --name-only --diff-filter=ACMRDTUXB "$BASE_SHA" "$HEAD_SHA")"
            [[ -n "$changed" ]] || run_all=true

            while IFS= read -r file; do
              [[ -n "$file" ]] || continue

              case "$file" in
                Cargo.toml|Cargo.lock|src/*)
                  core=true
                  ;;
              esac

              case "$file" in
                spikes/github-adapter/*|scripts/verify-github-adapter-spike.sh)
                  adapter=true
                  ;;
              esac

              case "$file" in
                spikes/go/*|spikes/rust/*|spikes/yaml-fidelity/*|fixtures/config/*|fixtures/observed-state/*|fixtures/workflows/*|scripts/verify-technology-spikes.sh)
                  technology=true
                  ;;
              esac

              case "$file" in
                spikes/go/*|spikes/rust/*|scripts/verify-packaging-spike.sh)
                  packaging=true
                  ;;
              esac

              case "$file" in
                .github/workflows/required-ci.yml)
                  run_all=true
                  ;;
                *.md|README*|LICENSE*|docs/*)
                  ;;
                Cargo.toml|Cargo.lock|src/*|spikes/github-adapter/*|spikes/go/*|spikes/rust/*|spikes/yaml-fidelity/*|fixtures/config/*|fixtures/observed-state/*|fixtures/workflows/*|scripts/verify-github-adapter-spike.sh|scripts/verify-packaging-spike.sh|scripts/verify-technology-spikes.sh)
                  ;;
                *)
                  run_all=true
                  ;;
              esac
            done <<< "${changed:-}"
          fi

          if [[ "$run_all" == true ]]; then
            core=true
            adapter=true
            technology=true
            packaging=true
          fi

          {
            echo "core=$core"
            echo "adapter=$adapter"
            echo "technology=$technology"
            echo "packaging=$packaging"
          } >> "$GITHUB_OUTPUT"

  core:
    name: Rust core
    needs: impact
    if: ${{ needs.impact.outputs.core == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets

  github-adapter:
    name: GitHub adapter spike
    needs: impact
    if: ${{ needs.impact.outputs.adapter == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/verify-github-adapter-spike.sh

  technology:
    name: Technology spikes
    needs: impact
    if: ${{ needs.impact.outputs.technology == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/verify-technology-spikes.sh

  packaging:
    name: Packaging (${{ matrix.os }})
    needs: impact
    if: ${{ needs.impact.outputs.packaging == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: spikes/go/go.mod
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - shell: bash
        run: bash scripts/verify-packaging-spike.sh

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [impact, core, github-adapter, technology, packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required CI results
        shell: bash
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          CORE_IMPACT: ${{ needs.impact.outputs.core }}
          CORE_RESULT: ${{ needs.core.result }}
          ADAPTER_IMPACT: ${{ needs.impact.outputs.adapter }}
          ADAPTER_RESULT: ${{ needs.github-adapter.result }}
          TECHNOLOGY_IMPACT: ${{ needs.impact.outputs.technology }}
          TECHNOLOGY_RESULT: ${{ needs.technology.result }}
          PACKAGING_IMPACT: ${{ needs.impact.outputs.packaging }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
        run: |
          set -euo pipefail

          [[ "$IMPACT_RESULT" == "success" ]] || {
            echo "::error::impact: $IMPACT_RESULT"
            exit 1
          }

          verify() {
            local selected="$1"
            local result="$2"
            local name="$3"

            if [[ "$selected" == "true" ]]; then
              [[ "$result" == "success" ]] || {
                echo "::error::$name: $result"
                exit 1
              }
            else
              [[ "$result" == "skipped" || "$result" == "success" ]] || {
                echo "::error::$name unexpected result: $result"
                exit 1
              }
            fi
          }

          verify "$CORE_IMPACT" "$CORE_RESULT" core
          verify "$ADAPTER_IMPACT" "$ADAPTER_RESULT" github-adapter
          verify "$TECHNOLOGY_IMPACT" "$TECHNOLOGY_RESULT" technology
          verify "$PACKAGING_IMPACT" "$PACKAGING_RESULT" packaging
