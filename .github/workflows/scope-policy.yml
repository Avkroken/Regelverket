name: Scope policy

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  scope-policy:
    name: scope-policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify approved workflow inventory
        shell: bash
        run: |
          set -euo pipefail

          expected=$'required-ci.yml\nscope-policy.yml'
          actual="$(
            find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) -printf '%f\n' \
              | LC_ALL=C sort
          )"

          if [[ "$actual" != "$expected" ]]; then
            echo "::error::Workflow inventory differs from the retired Regelverket baseline."
            echo "Expected:"
            printf '%s\n' "$expected"
            echo "Actual:"
            printf '%s\n' "$actual"
            exit 1
          fi
