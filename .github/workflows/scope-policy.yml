name: Scope policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scope-policy:
    name: scope-policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify retired automation stays removed
        shell: bash
        run: |
          set -euo pipefail
          retired=(
            .github/workflows/sync-pool.yml
            .github/workflows/pr-watchdog.yml
            .github/workflows/auto-fix-review.yml
            .github/workflows/codex-issue-remediation.yml
            .github/workflows/startup-smoke.yml
            .github/workflows/security-alert-snapshot.yml
          )
          for path in "${retired[@]}"; do
            if [[ -e "$path" ]]; then
              echo "::error::Retired automation must not be reintroduced: $path"
              exit 1
            fi
          done
