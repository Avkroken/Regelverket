name: OSV-Scanner

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main
  schedule:
    - cron: '10 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  prepare-auto-merge:
    name: prepare-auto-merge
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Update PR branch to latest base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          base_sha="$(jq -r '.base.sha' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"
          behind_by="$(gh api "repos/$REPOSITORY/compare/$base_sha...$head_sha" --jq '.behind_by')"
          if (( behind_by > 0 )); then
            gh pr update-branch "$PR_NUMBER" --repo "$REPOSITORY"
          else
            echo "PR branch is already current with its base."
          fi

      - name: Arm native auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          armed="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [[ "$armed" == "true" ]]; then
            echo "Native auto-merge is already armed."
            exit 0
          fi
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash --match-head-commit "$head_sha"

  scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write

  scan-main:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      fail-on-vuln: false

  osv:
    name: osv
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [scan-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Verify OSV gate
        shell: bash
        env:
          PR_RESULT: ${{ needs.scan-pr.result }}
        run: |
          set -euo pipefail
          [[ "$PR_RESULT" == "success" ]] || { echo "::error::OSV PR-skanning: $PR_RESULT"; exit 1; }
