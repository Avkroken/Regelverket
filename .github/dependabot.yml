version: 2
updates:
  - package-ecosystem: "github-actions"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "Europe/Stockholm"
    groups:
      actions-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "cargo"
    assignees: ["blixten85"]
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:10"
      timezone: "Europe/Stockholm"
    groups:
      cargo-patch-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "gomod"
    assignees: ["blixten85"]
    directories:
      - "/spikes/go"
      - "/spikes/github-adapter/go"
      - "/spikes/yaml-fidelity/go"
    schedule:
      interval: "daily"
      time: "01:20"
      timezone: "Europe/Stockholm"
    groups:
      gomod-patch-minor:
        update-types: ["minor", "patch"]
